      name="description"

    <link rel="canonical" href="https://grupoespaciocreativo.com/" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />

    <!-- Open Graph — WhatsApp, LinkedIn, Facebook. Las URL deben ser absolutas:
         los rastreadores no resuelven rutas relativas. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_HN" />
    <meta property="og:site_name" content="Grupo Espacio Creativo" />
    <meta property="og:title" content="Grupo Espacio Creativo — Crecimiento Creativo Empresarial" />
    <meta
      property="og:description"
      content="Estrategia, producción, formación, soluciones y experiencias en un solo ecosistema."
    />
    <meta property="og:url" content="https://grupoespaciocreativo.com/" />
    <meta property="og:image" content="https://grupoespaciocreativo.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Meraki, la mascota de Grupo Espacio Creativo" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Grupo Espacio Creativo — Crecimiento Creativo Empresarial" />
    <meta
      name="twitter:description"
      content="Estrategia, producción, formación, soluciones y experiencias en un solo ecosistema."
    />
    <meta name="twitter:image" content="https://grupoespaciocreativo.com/og.png" />

    <!-- Schema Organization — FASE 6 de la guía. Nombre/descripción son el
         texto literal aprobado ("Grupo Espacio Creativo - Agencia de
         Crecimiento Creativo Empresarial."); el resto son los datos reales
         de contacto y redes que ya usa el Footer (src/data/site.js). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Grupo Espacio Creativo",
        "alternateName": "GEC",
        "description": "Agencia de Crecimiento Creativo Empresarial.",
        "url": "https://grupoespaciocreativo.com/",
        "logo": "https://grupoespaciocreativo.com/logos/gec-color.png",
        "image": "https://grupoespaciocreativo.com/og.png",
        "telephone": ["+504 2234-8414", "+504 9828-3018"],
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Centro Comercial Plaza Roble, Local 15",
          "addressLocality": "Comayagüela",
          "addressRegion": "Francisco Morazán",
          "addressCountry": "HN"
        },
        "sameAs": [
          "https://www.youtube.com/Grupoespaciocreativo",
          "https://www.facebook.com/espaciocreativo/",
          "https://www.behance.net/GrupoEspacioCreativo",
          "https://www.linkedin.com/company/grupo-espacio-creativo",
          "https://open.spotify.com/show/1nZxk3zAlFguE9RJcOQu1P"
        ]
      }
    </script>

    <!-- El hero pinta desde el primer frame de la secuencia: lo pedimos de una.
         Cada pantalla el suyo — en el teléfono se sirve la secuencia ligera y
         precargar la grande son 40 KB tirados. -->
    <link
      rel="preload"
      as="image"
      href="/assets/sequences/scene_1/frame_000.webp"
      media="(min-width: 768px)"
    />
    <link
      rel="preload"
      as="image"
      href="/assets/sequences/scene_1_m/frame_000.webp"
      media="(max-width: 767px)"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
